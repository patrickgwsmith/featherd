# How ../deploy.sh deploys this example.
#
# The first run seeds the bucket from the midnight zip (about 650 MB, two
# GitHub requests) and deletes the zip afterwards; every run then applies
# the deltas since. The view of the newest CVEs is published as index.html
# and feed.xml, and mut/sync as sync.txt.
bucket=cve
publish=(view/index.html=index.html view/feed.xml=feed.xml mut/sync=sync.txt)
check() {
	command -v unzip >/dev/null || die "cve needs unzip to check the midnight zip"
}
build() { go build -o "$bin" .; }
run() {
	local status
	status=$(fcurl -sS -I -o /dev/null -w '%{http_code}' "$FEATHERD/$BUCKET/mut/sync")
	case $status in
		200) ;;
		404)
			log "cve: no mut/sync yet, seeding from the midnight zip"
			make -s seed SYNC="$bin"
			rm -rf cache
			;;
		*) die "cve: checking mut/sync returned HTTP $status" ;;
	esac
	"$bin" -once
}
