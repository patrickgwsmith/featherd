# How ../deploy.sh deploys this example.
#
# The first run seeds the bucket from the midnight zip (about 650 MB, two
# GitHub requests) and deletes the zip afterwards; every run then applies
# the deltas since. The views of the newest CVEs are published as index.html
# and feed.xml, and of just the HIGH and CRITICAL ones as high.html and
# high.xml, of Apple's and Android's as apple.html, apple.xml, android.html
# and android.xml, and mut/sync as sync.txt. The vendor pages and OSV
# entries mirrored under refs/ stay in the bucket.
bucket=cve
publish=(view/index.html=index.html view/feed.xml=feed.xml view/high.html=high.html view/high.xml=high.xml view/apple.html=apple.html view/apple.xml=apple.xml view/android.html=android.html view/android.xml=android.xml mut/sync=sync.txt)
check() {
	command -v unzip >/dev/null || die "cve needs unzip to check the midnight zip"
}
build() { go build -o "$bin" .; }
run() {
	local status
	status=$(fcurl -sS -I -o /dev/null -w '%{http_code}' "$FEATHERD/$BUCKET/mut/sync")
	case $status in
		200) ;;
		404)
			log "cve: no mut/sync yet, seeding from the midnight zip"
			make -s seed SYNC="$bin"
			rm -rf cache
			;;
		*) die "cve: checking mut/sync returned HTTP $status" ;;
	esac
	"$bin" -once
}
