# How ../deploy.sh deploys this example.
#
# The first run seeds the bucket from the midnight zip (about 650 MB, two
# GitHub requests) and deletes the zip afterwards; every run then applies
# the deltas since. The views of the newest CVEs are published as index.html
# and feed.xml, and of just the HIGH and CRITICAL ones as high.html and
# high.xml, of Apple's, Android's, the Linux kernel's (HIGH and CRITICAL
# only) and Microsoft's as <vendor>.html and <vendor>.xml, of the CVEs
# added to CISA's KEV catalog most recently as kev.html and kev.xml, and
# mut/sync as sync.txt. The vendor pages, OSV entries and KEV copies
# mirrored under refs/ stay in the bucket.
bucket=cve
publish=(view/index.html=index.html view/feed.xml=feed.xml view/high.html=high.html view/high.xml=high.xml view/apple.html=apple.html view/apple.xml=apple.xml view/android.html=android.html view/android.xml=android.xml view/linux.html=linux.html view/linux.xml=linux.xml view/microsoft.html=microsoft.html view/microsoft.xml=microsoft.xml view/kev.html=kev.html view/kev.xml=kev.xml mut/sync=sync.txt)
check() {
	command -v unzip >/dev/null || die "cve needs unzip to check the midnight zip"
}
build() { go build -o "$bin" .; }
run() {
	local status
	status=$(fcurl -sS -I -o /dev/null -w '%{http_code}' "$FEATHERD/$BUCKET/mut/sync")
	case $status in
		200) ;;
		404)
			log "cve: no mut/sync yet, seeding from the midnight zip"
			make -s seed SYNC="$bin"
			rm -rf cache
			;;
		*) die "cve: checking mut/sync returned HTTP $status" ;;
	esac
	"$bin" -once
}
