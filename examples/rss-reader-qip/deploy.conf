# How ../deploy.sh deploys this example.
bucket=rss-qip
seed=(config/subscriptions.opml=subscriptions.opml)
publish=(view/index.html=index.html)
check() {
	command -v odin >/dev/null || die "rss-reader-qip needs Odin to build its components"
	node -e 'process.exit(+process.versions.node.split(".")[0] >= 22 ? 0 : 1)' ||
		die "rss-reader-qip needs Node 22 or newer"
}
build() { make -s; }
run() { node rss-reader.mjs --once; }
